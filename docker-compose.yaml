services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: database
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: sewalensa-app
      MYSQL_ROOT_PASSWORD: Abcd1234
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel_network

  # phpMyAdmin Interface
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  dbdata:
    driver: local